# Push a tag that matches manifest.json's version (e.g. 1.1.0) and this
# builds main.js and makes a draft release with what Obsidian needs. Check
# the draft on GitHub, then publish it.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write # attestations: sign with GitHub's OIDC identity
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag doesn't match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # Provenance: anyone can check these files were built here, from this commit
      # (gh attestation verify <file> --repo krishnanefx/obsidian-tahoe-intelligence).
      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Draft the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --draft main.js manifest.json styles.css
